apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: ai-platform
  labels:
    app: worker-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker-service
          # Pin this to a real CI image tag before deploying, e.g. the
          # commit SHA published by .github/workflows/ci.yml:
          #   ghcr.io/prajjaval08/distributed-ai-platform-worker-service:<sha>
          # :latest is a placeholder here so the manifest applies at all;
          # do not rely on it in production.
          image: ghcr.io/prajjaval08/distributed-ai-platform-worker-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: ai-platform-worker-config
            - secretRef:
                name: ai-platform-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
