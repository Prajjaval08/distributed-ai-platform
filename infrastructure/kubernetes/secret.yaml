# PLACEHOLDERS ONLY — replace every value before applying, ideally by
# creating this Secret from your secret manager instead of editing the file:
#   kubectl -n ai-platform create secret generic ai-platform-secrets \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=OBJECT_STORAGE_ACCESS_KEY='...' \
#     --from-literal=OBJECT_STORAGE_SECRET_KEY='...' \
#     --from-literal=AI_PROVIDER_API_KEY='...'
# Never commit real values here. stringData is used so the placeholders stay
# readable; Kubernetes base64-encodes them on write (that is encoding, not
# encryption — use a sealed/externally-managed secret in production).
apiVersion: v1
kind: Secret
metadata:
  name: ai-platform-secrets
  namespace: ai-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-before-applying"
  JWT_SECRET: "change-me-before-applying-at-least-32-chars"
  OBJECT_STORAGE_ACCESS_KEY: "change-me-before-applying"
  OBJECT_STORAGE_SECRET_KEY: "change-me-before-applying"
  AI_PROVIDER_API_KEY: "change-me-if-using-a-real-provider"
