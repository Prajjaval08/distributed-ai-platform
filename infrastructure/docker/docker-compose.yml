services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ai-platform-jaeger
    restart: unless-stopped

    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver

    environment:
      COLLECTOR_OTLP_ENABLED: "true"


  postgres:
    image: postgres:16-alpine
    container_name: ai-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: ai_platform_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}

    ports:
      - "55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform_user -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 5


  postgres-replica:
    image: postgres:16-alpine
    container_name: ai-platform-postgres-replica
    restart: unless-stopped
    user: postgres

    environment:
      PGPASSWORD: replicatorpassword

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5433:5432"

    volumes:
      - postgres_replica_data:/var/lib/postgresql/data

    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        echo "Starting PostgreSQL replica initialization..."

        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then

          echo "Running pg_basebackup from primary..."

          until pg_basebackup \
            -h postgres \
            -D /var/lib/postgresql/data \
            -U replicator \
            -Fp \
            -Xs \
            -P \
            -R
          do
            echo "Waiting for primary to be ready for basebackup..."
            sleep 2
          done

          chmod 0700 /var/lib/postgresql/data

          echo "Base backup completed."

        fi

        echo "Starting PostgreSQL replica..."

        exec postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform_user -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  redis:
    image: redis:7-alpine
    container_name: ai-platform-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


  minio:
    image: minio/minio:latest
    container_name: ai-platform-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5


  minio-init:
    image: minio/mc:latest
    container_name: ai-platform-minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/ai-platform-artifacts --ignore-existing;
      exit 0;
      "


  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ai-platform-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:29092,
        CONTROLLER://0.0.0.0:29093,
        PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: ai-platform-kafka-init

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic ai-jobs-high --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic ai-jobs --partitions 6 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic ai-jobs-low --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic ai-job-results --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic ai-job-failures --partitions 3 --replication-factor 1;

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic ai-jobs-dlq --partitions 3 --replication-factor 1;

      echo 'Topics created.';
      "


  nginx:
    image: nginx:1.27-alpine
    container_name: ai-platform-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"


  prometheus:
    image: prom/prometheus:latest
    container_name: ai-platform-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"


  grafana:
    image: grafana/grafana:latest
    container_name: ai-platform-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana
      - ../../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro


volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data: