ai:
  provider:
    type: ${AI_PROVIDER_TYPE:mock}
    api-key: ${AI_PROVIDER_API_KEY:}
    url: ${AI_PROVIDER_URL:https://api.openai.com/v1}
    default-model: ${AI_PROVIDER_MODEL:dall-e-3}

object-storage:
  endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
  bucket: ${OBJECT_STORAGE_BUCKET:ai-platform-artifacts}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:minioadmin}
  region: ${OBJECT_STORAGE_REGION:us-east-1}
  presigned-url-expiry-seconds: ${OBJECT_STORAGE_PRESIGNED_EXPIRY_SECONDS:604800}
  
spring:
  application:
    name: api-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_platform
    username: ai_platform_user
    password: ${POSTGRES_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-change-me-32chars-min}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never