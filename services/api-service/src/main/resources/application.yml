ai:
  provider:
    type: ${AI_PROVIDER_TYPE:mock}
    api-key: ${AI_PROVIDER_API_KEY:}
    url: ${AI_PROVIDER_URL:https://api.openai.com/v1}
    default-model: ${AI_PROVIDER_MODEL:dall-e-3}

object-storage:
  endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
  bucket: ${OBJECT_STORAGE_BUCKET:ai-platform-artifacts}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:minioadmin}
  region: ${OBJECT_STORAGE_REGION:us-east-1}
  presigned-url-expiry-seconds: ${OBJECT_STORAGE_PRESIGNED_EXPIRY_SECONDS:604800}

kafka-topics:
  ai-jobs: ${KAFKA_TOPIC_AI_JOBS:ai-jobs}
  ai-jobs-high: ${KAFKA_TOPIC_AI_JOBS_HIGH:ai-jobs-high}
  ai-jobs-low: ${KAFKA_TOPIC_AI_JOBS_LOW:ai-jobs-low}

cache:
  job-ttl-seconds: ${REDIS_JOB_CACHE_TTL_SECONDS:60}

rate-limit:
  jobs-per-hour: ${RATE_LIMIT_JOBS_PER_HOUR:100}
  auth-per-hour: ${RATE_LIMIT_AUTH_PER_HOUR:10}

spring:
  application:
    name: api-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_platform
    username: ai_platform_user
    password: ${POSTGRES_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-change-me-32chars-min}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never