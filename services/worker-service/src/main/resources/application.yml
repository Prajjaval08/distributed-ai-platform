ai:
  provider:
    type: ${AI_PROVIDER_TYPE:mock}
    api-key: ${AI_PROVIDER_API_KEY:}
    url: ${AI_PROVIDER_URL:https://api.openai.com/v1}
    default-model: ${AI_PROVIDER_MODEL:dall-e-3}

object-storage:
  endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
  bucket: ${OBJECT_STORAGE_BUCKET:ai-platform-artifacts}
  access-key: ${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${OBJECT_STORAGE_SECRET_KEY:minioadmin}
  region: ${OBJECT_STORAGE_REGION:us-east-1}
  presigned-url-expiry-seconds: ${OBJECT_STORAGE_PRESIGNED_EXPIRY_SECONDS:604800}

kafka-topics:
  ai-jobs: ${KAFKA_TOPIC_AI_JOBS:ai-jobs}
  ai-jobs-high: ${KAFKA_TOPIC_AI_JOBS_HIGH:ai-jobs-high}
  ai-jobs-low: ${KAFKA_TOPIC_AI_JOBS_LOW:ai-jobs-low}
  ai-jobs-dlq: ${KAFKA_TOPIC_AI_JOBS_DLQ:ai-jobs-dlq}

retry:
  max-attempts: 3
  base-delay-ms: 2000
  max-delay-ms: 10000
  jitter-factor: 0.2

cache:
  job-ttl-seconds: ${REDIS_JOB_CACHE_TTL_SECONDS:60}

resilience:
  ai-provider-timeout-seconds: ${AI_PROVIDER_TIMEOUT_SECONDS:10}
  object-storage-timeout-seconds: ${OBJECT_STORAGE_TIMEOUT_SECONDS:5}
  circuit-breaker-failure-rate-threshold: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
  circuit-breaker-wait-duration-seconds: ${CIRCUIT_BREAKER_WAIT_DURATION_SECONDS:10}
  circuit-breaker-min-calls: ${CIRCUIT_BREAKER_MIN_CALLS:5}

spring:
  application:
    name: worker-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/ai_platform}
    username: ai_platform_user
    password: ${POSTGRES_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
